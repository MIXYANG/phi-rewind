name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: phi-rewind
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v7
        with:
          path: phi-rewind

      # Remove this checkout when the host APIs have a released SDK version.
      - name: Checkout unreleased Phi SDK
        uses: actions/checkout@v7
        with:
          repository: MIXYANG/phi
          ref: fba2e5dafb1a85b8c599243497dfc801ddd3a9fb
          path: phi

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: phi-rewind/go.mod
          cache-dependency-path: phi-rewind/go.sum

      - name: Run tests
        run: go test ./...

      - name: Build
        run: go build ./...
